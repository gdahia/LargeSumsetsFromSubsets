      groups, which is formalized only in the form for subsets of a set of small doubling.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use finite sets of an abelian group and of ZMod p, pointwise sums,
      symmetric differences, Finset.expect and Finset.powersetCard. The proofs use the triangle
      removal lemma, the Plünnecke–Ruzsa inequality and the Cauchy–Davenport theorem in ZMod p
      and in ℤ. Mathlib has none of the results of the paper.
  - id: "https://github.com/gdahia/LargeSumsetsFromSmallSubsets"
    relationship: "builds-on"
    note: >-
      A Lake dependency. Its Corollary 24 gives Theorem 4 of the paper, used for Theorems 1
      and 6. Its form of Theorem 31, with the subsets of B depending on A, gives the form of
      Theorem 5 used for Theorem 8.

status:
  scope: >-
    Theorems 1, 2, 6 and 8 of the paper, Lemmas 9 and 10, Corollary 11, Lemma 12 for one point,
    and Theorem 8 for intervals of integers. Theorem 4 and a weaker form of Theorem 5, with the
    subsets of B depending on A, come from the dependency LargeSumsetsFromSmallSubsets. Theorem
    3 of the paper (Shao) is not used. The library also proves the arithmetic removal lemma for
    subsets of a set of small doubling and the cleanup theorem, which replace Shao's theorem in
    the proof of Theorem 2. The sorry counts refer to the library and Solution.lean;
    Challenge.lean has one placeholder for each of its six statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

