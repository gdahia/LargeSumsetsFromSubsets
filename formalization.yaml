# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Large sumsets from medium-sized subsets"
  description: >-
    Lean 4 formalization of the results of Bollobás, Leader and Tiba, Large sumsets from
    medium-sized subsets. Theorem 2: in an abelian group, for finite A and B and integers
    c₁ ≤ |A| and c₂ ≤ |B| with c₁c₂ > c(σ, ε) max(|A|, |B|), there are subsets A₀ and B₀
    containing all but an ε proportion of A and B such that c₁ random points of A₀ and c₂ random
    points of B₀ have a sumset of expected size greater than min((1 - ε)|A₀ + B₀|, σ|A₀|,
    σ|B₀|). It is proved with the arithmetic removal lemma for subsets of a set of small
    doubling, deduced from Mathlib's triangle removal lemma, in place of Shao's almost-all
    Balog–Szemerédi–Gowers theorem. Theorem 1: for A, B ⊆ Z_p with α|B| ≤ |A| ≤ α⁻¹|B| and
    |A| + |B| ≤ (1 - β)p, and c₁c₂ ≥ c(α, β) max(|A|, |B|), there are A' ⊆ A and B' ⊆ B with c₁
    and c₂ elements and |A' + B'| ≥ |A| + |B| - 1. Theorems 4 and 5 of the paper, which it
    quotes from the authors' Large sumsets from small subsets, come from the formalization
    LargeSumsetsFromSmallSubsets, which proves Theorem 5 in a weaker form; the proof of Theorem 8
    is adapted to that form.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B13", "11B30", "11P70", "05D40"]

