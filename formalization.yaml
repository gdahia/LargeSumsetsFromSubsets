    note: >-
      Discrete Analysis 2019:18. The cleanup theorem is a variant of Theorem 1.1 that assumes
      that the full sumset is small. The arithmetic removal lemma is Corollary 2.5, proved as in
      the remark that follows it. See fidelity.divergences.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A combinatorial proof of the removal lemma for groups"
    authors:
      - "Daniel Král"
      - "Oriol Serra"
      - "Lluís Vena"
    id: "https://doi.org/10.1016/j.jcta.2008.12.003"
    type: "paper"
    relationship: "adapts"
    note: >-
      J. Combin. Theory Ser. A 116 (2009), 971–978. The proof of the arithmetic removal lemma
      uses the tripartite graph of this paper, with vertex classes X ∪ (X + X) in place of the
      group.
    license: "unknown"
    author_endorsement: "not-contacted"
