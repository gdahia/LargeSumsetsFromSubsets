# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Large sumsets from subsets"
  description: >-
    Lean 4 formalization of two theorems on subsets with large sumset in an abelian group.
    The first is Theorem 2 of Bollobás, Leader and Tiba: for finite sets A and B and integers
    c₁ ≤ |A| and c₂ ≤ |B| with c₁c₂ > c(σ, ε) max(|A|, |B|), there are subsets A₀ and B₀
    containing all but an ε proportion of A and B such that c₁ random points of A₀ and c₂
    random points of B₀ have a sumset of expected size greater than
    min((1 - ε)|A₀ + B₀|, σ|A₀|, σ|B₀|). The constant c(σ, ε) is explicit. The second is
    Theorem 1.1 of Fox, Luo, Pham and Zhou: a finite set A with |A + A| = κ|A| has a subset T
    of at most s elements with |A + T| ≥ min(κ^(1/3), s)|A|/14. The project also proves, with
    explicit thresholds, the arithmetic removal lemma for subsets of a set of small doubling,
    from the triangle removal lemma in Mathlib, and a variant of Shao's almost-all
    Balog–Szemerédi–Gowers theorem for pairs of sets with small sumset.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B13", "11B30", "11P70", "05D40"]

sources:
  - title: "Large sumsets from medium-sized subsets"
    authors:
      - "Béla Bollobás"
      - "Imre Leader"
      - "Marius Tiba"
    id: "arXiv:2206.09366"
    type: "paper"
    location: "https://arxiv.org/abs/2206.09366"
    relationship: "formalizes"
    note: >-
      Theorem 2 only. The paper applies Shao's theorem repeatedly to a decreasing sequence of
      pairs of subsets. The Lean proof follows a different strategy. It first proves a
      normalized form for K ≥ 1 and 0 < ε ≤ 1, in which the subsets contain at least a
      1 - ε/4 proportion of A and B and the inequalities are not strict. It takes one pair
      (X, Y) of nonempty subsets minimizing min(|X + Y|, D|X|, D|Y|) + Λ(|A \ X| + |B \ Y|),
      with Λ = 4D/ε. If the conclusion failed for (X, Y), the sums with at least
      α min(|X|, |Y|) representations, where α = δ/(36K), would be few and would contain the
      sums of all but a δ proportion of the pairs. A pair of subsets with a smaller value is
      then obtained from the cleanup theorem when |X + Y| ≤ D min(|X|, |Y|), and from an
      elementary covering bound otherwise. The probability that a sum is sampled is bounded
      by a second-moment estimate.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Small subsets with large sumset: beyond the Cauchy–Davenport bound"
    authors:
      - "Jacob Fox"
      - "Sammy Luo"
      - "Huy Tuan Pham"
      - "Yunkun Zhou"
    id: "arXiv:2210.07196"
    type: "paper"
    location: "https://arxiv.org/abs/2210.07196"
    relationship: "formalizes"
    note: >-
      Theorem 1.1 only, with the constant 1/14 of its proof. The proof is by induction on s,
      as in the paper.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On an almost all version of the Balog–Szemerédi–Gowers theorem"
    authors:
      - "Xuancheng Shao"
    id: "arXiv:1811.10707"
    type: "paper"
    location: "https://arxiv.org/abs/1811.10707"
    relationship: "adapts"
    note: >-
      The cleanup theorem is a variant of Theorem 1.1. The Lean proof applies the arithmetic
      removal lemma inside a translate of X + Y, whose doubling is bounded by the
      Plünnecke–Ruzsa inequality, and does not use Freiman models. The arithmetic removal
      lemma is Corollary 2.5, proved as in the remark that follows it in the paper, from the
      triangle removal lemma. See fidelity.divergences.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A Szemerédi-type regularity lemma in abelian groups, with applications"
    authors:
      - "Ben Green"
    type: "paper"
    relationship: "background"
    note: >-
      Geom. Funct. Anal. 15 (2005), 340–376. The arithmetic removal lemma for finite abelian
      groups. The project proves it only in the form for subsets of a set of small doubling.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A combinatorial proof of the removal lemma for groups"
    authors:
      - "Daniel Král"
      - "Oriol Serra"
      - "Lluís Vena"
    type: "paper"
    relationship: "adapts"
    note: >-
      J. Combin. Theory Ser. A 116 (2009), 971–978. The proof of the arithmetic removal
      lemma uses the tripartite graph of this paper, with vertex classes X ∪ (X + X) in
      place of the group.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use finite sets, pointwise sumsets, Finset.expect, real powers and the
      bound SimpleGraph.triangleRemovalBound of the triangle removal lemma, from Mathlib. The
      proofs use its triangle removal lemma, tripartite graphs and the Plünnecke–Ruzsa
      inequality. Mathlib has none of the theorems of the sources.

status:
  scope: >-
    The project proves Theorem 2 of Bollobás, Leader and Tiba in three forms, Theorem 1.1 of
    Fox, Luo, Pham and Zhou, the arithmetic removal lemma for subsets of a set of small
    doubling, and the cleanup theorem. It does not formalize the other results of the
    Bollobás–Leader–Tiba paper, which concern subsets of Z_p, the asymmetric and other
    theorems of Fox, Luo, Pham and Zhou, Shao's theorem under his hypothesis, or the
    arithmetic removal lemma with better than tower-type constants. Challenge.lean states
    Theorem 2 of Bollobás, Leader and Tiba, the arithmetic removal lemma, the positivity of
    its threshold, the cleanup theorem and Theorem 1.1 of Fox, Luo, Pham and Zhou. The sorry
    counts refer to the library and Solution.lean; Challenge.lean has one placeholder for
    each of its five statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

