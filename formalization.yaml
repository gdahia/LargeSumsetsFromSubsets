# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Large sumsets from subsets"
  description: >-
    Lean 4 formalization of two theorems on subsets with large sumset in an abelian group.
    The first is Theorem 2 of Bollobás, Leader and Tiba: for finite sets A and B and integers
    c₁ ≤ |A| and c₂ ≤ |B| with c₁c₂ > c(σ, ε) max(|A|, |B|), there are subsets A₀ and B₀
    containing all but an ε proportion of A and B such that c₁ random points of A₀ and c₂
    random points of B₀ have a sumset of expected size greater than
    min((1 - ε)|A₀ + B₀|, σ|A₀|, σ|B₀|). The second is Theorem 1.1 of Fox, Luo, Pham and
    Zhou: a finite set A with |A + A| = κ|A| has a subset T of at most s elements with
    |A + T| ≥ min(κ^(1/3), s)|A|/14. The project also proves the arithmetic removal lemma
    for subsets of a set of small doubling, from the triangle removal lemma in Mathlib, and
    a variant of Shao's almost-all Balog–Szemerédi–Gowers theorem for pairs of sets with
    small sumset.
  authors:
    - name: "Gabriel Dahia"
      github: "gdahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Gabriel Dahia"
      github: "gdahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B13", "11B30", "11P70", "05D40"]

sources:
  - title: "Large sumsets from medium-sized subsets"
    authors:
      - "Béla Bollobás"
      - "Imre Leader"
      - "Marius Tiba"
    id: "arXiv:2206.09366"
    type: "preprint"
    location: "https://arxiv.org/abs/2206.09366"
    relationship: "formalizes"
    note: >-
      Theorem 2 only. The proof is not the one of the paper. See fidelity.divergences.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Small subsets with large sumset: beyond the Cauchy–Davenport bound"
    authors:
      - "Jacob Fox"
      - "Sammy Luo"
      - "Huy Tuan Pham"
      - "Yunkun Zhou"
    id: "arXiv:2210.07196"
    type: "article"
    location: "https://arxiv.org/abs/2210.07196"
    relationship: "formalizes"
    note: >-
      Theorem 1.1 only, with the constant 1/14 of its proof.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On an almost all version of the Balog–Szemerédi–Gowers theorem"
    authors:
      - "Xuancheng Shao"
    id: "arXiv:1811.10707"
    type: "article"
    location: "https://arxiv.org/abs/1811.10707"
    relationship: "adapts"
    note: >-
      The cleanup theorem is a variant of Theorem 1.1. It assumes that the full sumset is
      small. Shao assumes only that the restricted sumset is small. The arithmetic removal
      lemma is Corollary 2.5, proved as in the remark that follows it in the paper. See
      fidelity.divergences.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A Szemerédi-type regularity lemma in abelian groups, with applications"
    authors:
      - "Ben Green"
    type: "article"
    relationship: "background"
    note: >-
      Geom. Funct. Anal. 15 (2005), 340–376. The arithmetic removal lemma for finite abelian
      groups. The project proves it only in the form for subsets of a set of small doubling.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A combinatorial proof of the removal lemma for groups"
    authors:
      - "Daniel Král"
      - "Oriol Serra"
      - "Lluís Vena"
    type: "article"
    relationship: "adapts"
    note: >-
      J. Combin. Theory Ser. A 116 (2009), 971–978. The proof of the arithmetic removal
      lemma uses the tripartite graph of this paper, with vertex classes X ∪ (X + X) in
      place of the group.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/gdahia/DenseSetsWithoutLargeSumsets"
    relationship: "adapts"
    note: >-
      Source of the Bollobás–Leader–Tiba theorem, the arithmetic removal lemma and the
      cleanup theorem. Seven modules are copied from commit 5f4b915 with new module paths
      and the namespace LargeSumsetsFromSubsets. The proofs are unchanged.
  - id: "https://github.com/gdahia/CountingSetsWithGivenDoublingViaDimension"
    relationship: "adapts"
    note: >-
      Source of the Fox–Luo–Pham–Zhou theorem. One module is copied with a new namespace.

status:
  scope: >-
    The project proves Theorem 2 of Bollobás, Leader and Tiba in three forms, Theorem 1.1 of
    Fox, Luo, Pham and Zhou, the arithmetic removal lemma for subsets of a set of small
    doubling, and the cleanup theorem. It does not formalize the other results of the
    Bollobás–Leader–Tiba paper, which concern subsets of Z_p, the asymmetric and other
    theorems of Fox, Luo, Pham and Zhou, Shao's theorem under his hypothesis, or the
    arithmetic removal lemma with better than tower-type constants. The sorry counts below
    refer to the library and Solution.lean; Challenge.lean contains five statement
    placeholders.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["gpt-5.6 sol high", "claude opus 5"]
      framework: "Codex"
      tool_setup: >-
        Wrote the seven modules copied from DenseSetsWithoutLargeSumsets, in that
        repository. Its formalization.yaml describes Codex agents guided by the repository's
        AGENTS.md, with proofs checked in the pinned Lake environment.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: >-
        Not recorded in the source repository.
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Wrote the proof of the Fox–Luo–Pham–Zhou theorem in
        CountingSetsWithGivenDoublingViaDimension from the arXiv source of the paper. In this
        repository it copied the eight modules, renamed the module paths and the namespace,
        replaced a deprecated import, edited the documentation, and wrote Challenge.lean,
        Solution.lean, the README and this file. Everything is checked with the Lean
        compiler.
      cost:
        wall_time: "one session"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        One request listing the modules to copy, the declaration names to keep, the Palomar
        layout to follow and the sources to record.
  spend_usd: "not tracked"
  notes: >-
    The Lean proofs were written by AI agents in the two source repositories. This repository
    was assembled by Claude Code under the direction of Gabriel Dahia. The library and
    Solution.lean build without sorry. The solution theorems use propext, Classical.choice
    and Quot.sound only.

fidelity:
  divergences: >-
    Bollobás–Leader–Tiba, Theorem 2, statement. The paper takes any real K. The Lean
    statement requires σ > 0 in its place. The hypothesis is c₁c₂ > c max(|A|, |B|) and the
    three conclusions are strict inequalities, where the paper has ≥ throughout. The sets A₀
    and B₀ are nonempty. The random points are the values of uniformly random functions
    Fin c₁ → A₀ and Fin c₂ → B₀, and the expectation is Finset.expect over the pairs of
    functions. The constant is originalBltConstant σ ε = bltSampleConst K ε' with
    K = 2 max(σ, 1) and ε' = min(ε, 1)/2. It equals 1296 K / (ε' δ), where δ = bltDelta K ε'
    is at most removalConst(16 D^7, ρ/D) with D = 100 K^3 and ρ = ε'^2 / (1000 D), so it is
    of tower type. The functions originalBltConstant and bltConstant take unused proofs of
    σ > 0 and ε > 0 as arguments.

    Bollobás–Leader–Tiba, Theorem 2, proof. The paper applies Shao's theorem repeatedly to
    a decreasing sequence of pairs of subsets. The Lean proof follows
    DenseSetsWithoutLargeSumsets. It first proves a
    normalized form for K ≥ 1 and 0 < ε ≤ 1, in which the subsets contain at least a
    1 - ε/4 proportion of A and B and the inequalities are not strict. It takes one pair
    (X, Y) of nonempty subsets minimizing
    min(|X + Y|, D|X|, D|Y|) + Λ(|A \ X| + |B \ Y|), with Λ = 4D/ε. If the conclusion
    failed for (X, Y), the sums with at least α min(|X|, |Y|) representations, where
    α = δ/(36K), would be few and would contain the sums of all but a δ proportion of the
    pairs. A pair of subsets with a smaller value is then obtained from the cleanup theorem
    when |X + Y| ≤ D min(|X|, |Y|), and from an elementary covering bound otherwise. The
    probability that a sum is sampled is bounded by a second-moment estimate.

    Square-root form. exists_medium_sized_subsets_with_large_sumset_subsets is not stated
    in the paper. It takes c₁ = c₂ of order √max(|A|, |B|) and replaces the expectation by
    one sample, with the constant bltConstant σ ε = 8 (max(1, c(σ, ε)) + σ + 1)^2.

    Cleanup theorem. Shao's Theorem 1.1 takes |A| = |B| = N, a set Γ of at least
    (1 - δ) N^2 pairs and the hypothesis |A +_Γ B| ≤ KN, and gives |A' + B'| ≤ |A +_Γ B| + εN.
    The Lean theorem takes sets X and Y of any sizes and a set P, with Γ the set of pairs
    whose sum lies in P. It assumes |X + Y| ≤ D min(|X|, |Y|), which is stronger than
    Shao's hypothesis, and gives |X₀ + Y₀| ≤ |P| + ρ min(|X|, |Y|). The threshold for δ is
    removalConst(16 D^7, ρ/D). The Lean proof applies the arithmetic removal lemma inside
    a translate of X + Y, whose doubling is bounded by the Plünnecke–Ruzsa inequality. It
    does not use Freiman models.

    Arithmetic removal lemma. The statement is that of Shao's Corollary 2.5, for subsets
    A, B, C of a set X with |X + X| ≤ K|X|, with K ≥ 0 and the explicit threshold
    removalConst(K, ε) = triangleRemovalBound(ε / (36 (1 + K)^2)) / 2. The proof is the
    argument of Král, Serra and Vena on three copies of X ∪ (X + X), with the triangle
    removal lemma of Mathlib. That lemma is proved from Szemerédi's regularity lemma, so
    the threshold is of tower type. The removal lemma for a whole finite abelian group, as
    stated by Green, is not formalized separately.

    Fox–Luo–Pham–Zhou, Theorem 1.1. The Lean statement has the constant c = 1/14 and
    κ^(1/3) is a real power. The paper proves the symmetric theorem as the case A = B of
    its asymmetric Theorem 1.2. The Lean proof treats the symmetric case directly, by the
    same induction on s.

review:
  status: "not reviewed"
  reviewers: []
  notes: >-
    No independent mathematical or formalization review. The statements of Challenge.lean
    were checked against the papers by the agent that wrote them. lake comparator, run on
    macOS on 10 October 2026 with its sandbox disabled, accepts the solution with Lean's
    kernel, nanoda and con-ron. scripts/verify-comparator.sh, which runs it in the sandbox
    and needs Linux, has not been run.

alignment:
  namespace: "LargeSumsetsFromSubsets"
  statements:
    - source: "Bollobás–Leader–Tiba, Theorem 2"
      lean: "LargeSumsetsFromSubsets.exists_subset_min_lt_expect_card_bltSample_add"
      module: "Challenge"
      status: "proved"
      note: "With strict inequalities and the explicit constant originalBltConstant."
    - source: "Bollobás–Leader–Tiba, Theorem 2"
      lean: "LargeSumsetsFromSubsets.exists_medium_sized_subsets_with_large_sumset_sample"
      module: "LargeSumsetsFromSubsets.MediumSizedSubsets"
      status: "proved"
      note: "The library form of the previous statement."
    - source: "Bollobás–Leader–Tiba, Theorem 2, normalized form"
      lean: "LargeSumsetsFromSubsets.exists_medium_sized_subsets_with_large_sumset_core"
      module: "LargeSumsetsFromSubsets.MediumSizedSubsets"
      status: "proved"
      note: "For K ≥ 1 and 0 < ε ≤ 1, with the constant bltSampleConst K ε."
    - source: "Bollobás–Leader–Tiba, Theorem 2, square-root form"
      lean: "LargeSumsetsFromSubsets.exists_medium_sized_subsets_with_large_sumset_subsets"
      module: "LargeSumsetsFromSubsets.MediumSizedSubsets"
      status: "proved"
      note: "Not stated in the paper."
    - source: "Shao, Corollary 2.5 (arithmetic removal in a set of small doubling)"
      lean: "LargeSumsetsFromSubsets.ArithmeticRemoval.arithmetic_removal"
      module: "LargeSumsetsFromSubsets.ArithmeticRemoval"
      status: "proved"
      note: >-
        With the threshold removalConst. Stated in Challenge.lean as
        LargeSumsetsFromSubsets.exists_subset_card_sdiff_le_forall_add_ne, with
        LargeSumsetsFromSubsets.removalConst_pos.
    - source: "Shao, Theorem 1.1"
      lean: "LargeSumsetsFromSubsets.Cleanup.exists_cleanup"
      module: "LargeSumsetsFromSubsets.Cleanup"
      status: "proved"
      note: >-
        A variant that assumes the full sumset is small. Stated in Challenge.lean as
        LargeSumsetsFromSubsets.exists_subset_card_sdiff_le_card_add_le.
    - source: "Fox–Luo–Pham–Zhou, Theorem 1.1"
      lean: "LargeSumsetsFromSubsets.exists_subset_card_add_ge"
      module: "LargeSumsetsFromSubsets.FewTranslates"
      status: "proved"
      note: >-
        With c = 1/14. Stated in Challenge.lean as
        LargeSumsetsFromSubsets.exists_subset_card_le_mul_le_card_add.

acknowledgements: "Mathlib."
