      cost:
        wall_time: "one session"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        One request to go back to the version with the Fox–Luo–Pham–Zhou theorem and only
        what the downstream dependencies need, and to match the style and format of the
