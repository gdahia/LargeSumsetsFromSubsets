      framework: "Claude Code"
      tool_setup: >-
        Lean 4, Mathlib, shell, and the arXiv sources of the paper and of arXiv:2204.07559v2.
        The coordinating agent fixed the statements and an informal proof with explicit
        constants and delegated the proofs of individual modules to subagents.
      cost:
        wall_time: "two sessions"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        A first instruction to assemble the repository with Theorem 2 and the Palomar layout.
        A second instruction to make the repository a formalization of the paper with the
        removal proof of Theorem 2, to formalize its other main results, to remove Theorem 1.1
        of Fox, Luo, Pham and Zhou, and to follow the author's Palomar conventions. Later, one
        instruction to replace the hypotheses for Theorems 4 and 5 by the results of
        LargeSumsetsFromSmallSubsets, adapting the proof of Theorem 8 to the weaker form of
        Theorem 5 proved there, and to write a note on the adapted proof. Later, one instruction
        to check the style against the author's conventions and adjust it. Later, one instruction
        to restyle every module, including the main statements.
  spend_usd: "not tracked"
  notes: >-
    The first proofs of Theorem 2, the arithmetic removal lemma and the cleanup theorem were
    written by Codex agents directed by Gabriel Dahia. Claude Code, directed by Gabriel Dahia,
    restyled them, wrote the statements and proofs of Theorems 1, 6 and 8 and of the lemmas of
    Section 4 of the paper, and wrote Challenge.lean, Solution.lean, the README and this file.
    Later, the agent removed the hypotheses CauchyDavenportStability and
    FewTranslatesNearIntervals, deduced Theorems 4 and 5 from LargeSumsetsFromSmallSubsets,
    adapted the sample of Y in the proof of Theorem 8, and wrote simplified_proof.tex. Later,
    the agent restyled the changed modules and rewrote the docstrings without LaTeX. Later, the
    agent restyled every module and dropped the redundant casts from the main statements.
    Every proof is checked by Lean.

fidelity:
  divergences: >-
    Theorem 4 is stated as in the paper, with the progressions P and Q containing A and B. The
    form of Theorem 5 used is weaker than the paper's: for each set A close to the interval I
    there is one subset F ⊆ B with at most c elements and |A + F| ≥ |A| + |B| - 1, where the
    paper has one family of c-subsets of B that works for every such A on average. It is stated
    for intervals of integers. The proof of Theorem 8 is adapted: for each sampled class x of X
    and each dense class y of Y, the subset given for the class x is added to the sample of Y.
    With the largest class of X and t random classes, the sample of Y is t + 1 times larger, and
    the constant c of Theorem 8 changes accordingly.

    Theorem 2. The paper takes any real K; the Lean statement requires σ > 0 in its place. The
    hypothesis is c₁c₂ > c max(|A|, |B|) and the three conclusions are strict inequalities,
    where the paper has ≥ throughout. The sets A₀ and B₀ are nonempty. The random points are
    the values of uniformly random functions Fin c₁ → A₀ and Fin c₂ → B₀. The constant is
    existentially quantified in Challenge.lean and is originalBltConstant σ ε in the library,
    of tower type. The proof does not use Shao's theorem: it minimizes
    min(|X + Y|, D|X|, D|Y|) + Λ(|A \ X| + |B \ Y|) over pairs of nonempty subsets, and reduces
    the popular sums of a minimizer with the cleanup theorem or an elementary covering bound.

    Theorem 6. The random sets are uniformly random subsets with c₁ and c₂ elements, as in the
    paper. The progressions have a nonzero common difference.

    Theorem 8 is stated for intervals of ZMod p with m + n ≤ p, as in the paper, and in the
    library also for intervals of integers.

    Theorem 1. The subsets A' and B' have exactly c₁ and c₂ elements.

    Lemma 9. The constants 14 and 2⁵ of the paper are replaced by 30 and 2⁶, the error bounds
    are 133γ min(|A|, |B|), and the end intervals have at least ⌊βp/8⌋ points. The property of
    the end parts is that one of them, A ∩ I₁ or B ∩ J₁, is far from every arithmetic
    progression P in the sense |A ∩ I₁| ≤ 64 |(A ∩ I₁) ∆ P|, or both are empty.

    Lemma 10 is proved greedily under the hypotheses 2|W| + 4|X| ≤ |Y|, c₂ ≤ |Y| and
    16|X| ≤ min(c₁, |X|) c₂, with subsets of at most c₁ and c₂ elements, in place of
    8|X|, 8|W| ≤ |Y| < p/2. Corollary 11 is stated with a common bound for all pairs.
    Lemma 12 is stated for one point of I₀.

    Cleanup theorem. Shao's Theorem 1.1 takes |A| = |B| = N, a set Γ of at least
    (1 - δ)N² pairs and |A +_Γ B| ≤ KN, and gives |A' + B'| ≤ |A +_Γ B| + εN. The Lean theorem
    takes sets X and Y of any sizes and a set P, with Γ the pairs whose sum lies in P, assumes
    |X + Y| ≤ D min(|X|, |Y|), which is stronger than Shao's hypothesis, and gives
    |X₀ + Y₀| ≤ |P| + ρ min(|X|, |Y|).

    Arithmetic removal lemma. The statement is that of Shao's Corollary 2.5, for subsets
    A, B, C of a set X with |X + X| ≤ K|X|, K ≥ 0, with an existentially quantified threshold,
    which is removalConst(K, ε) = triangleRemovalBound(ε / (36(1 + K)²)) / 2 in the library.
    The removal lemma for a whole finite abelian group, as stated by Green, is not formalized
    separately.

