      FewTranslatesNearIntervals of Theorems 1 and 8 and is not proved here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Structural additive theory"
    authors:
      - "David J. Grynkiewicz"
    id: "https://doi.org/10.1007/978-3-319-00416-7"
    type: "book"
    relationship: "background"
    note: >-
      Developments in Mathematics 30, Springer, 2013. The formalized paper deduces its
      Theorem 4 from Theorem 21.8 of the book. Theorem 4 is the hypothesis
      CauchyDavenportStability of Theorems 1 and 6 and is not proved here.
  - title: "On an almost all version of the Balog–Szemerédi–Gowers theorem"
    authors:
      - "Xuancheng Shao"
    id: "https://arxiv.org/abs/1811.10707"
    type: "paper"
    location: "https://arxiv.org/abs/1811.10707"
    relationship: "adapts"
    note: >-
      Discrete Analysis 2019:18. The cleanup theorem is a variant of Theorem 1.1 that assumes
      that the full sumset is small. The arithmetic removal lemma is Corollary 2.5, proved as in
      the remark that follows it. See fidelity.divergences.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A combinatorial proof of the removal lemma for groups"
    authors:
      - "Daniel Král"
      - "Oriol Serra"
      - "Lluís Vena"
    id: "https://doi.org/10.1016/j.jcta.2008.12.003"
    type: "paper"
    relationship: "adapts"
    note: >-
      J. Combin. Theory Ser. A 116 (2009), 971–978. The proof of the arithmetic removal lemma
      uses the tripartite graph of this paper, with vertex classes X ∪ (X + X) in place of the
      group.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A Szemerédi-type regularity lemma in abelian groups, with applications"
    authors:
      - "Ben Green"
    id: "https://doi.org/10.1007/s00039-005-0509-8"
    type: "paper"
    relationship: "background"
    note: >-
      Geom. Funct. Anal. 15 (2005), 340–376. The arithmetic removal lemma for finite abelian
      groups, which is formalized only in the form for subsets of a set of small doubling.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use finite sets of an abelian group and of ZMod p, pointwise sums,
      symmetric differences, Finset.expect and Finset.powersetCard. The proofs use the triangle
      removal lemma, the Plünnecke–Ruzsa inequality and the Cauchy–Davenport theorem in ZMod p
      and in ℤ. Mathlib has none of the results of the paper.

status:
  scope: >-
    Theorems 1, 2, 6 and 8 of the paper, Lemmas 9 and 10, Corollary 11, Lemma 12 for one point,
    and Theorem 8 for intervals of integers. Theorems 1, 6 and 8 take Theorem 4, quoted from
    Grynkiewicz, and Theorem 5, Theorem 31 of arXiv:2204.07559v2, as the hypotheses
    CauchyDavenportStability and FewTranslatesNearIntervals; these are not formalized. Theorem
    3 of the paper (Shao) is not used. The library also proves the arithmetic removal lemma for
    subsets of a set of small doubling and the cleanup theorem, which replace Shao's theorem in
    the proof of Theorem 2. The sorry counts refer to the library and Solution.lean;
    Challenge.lean has one placeholder for each of its six statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

