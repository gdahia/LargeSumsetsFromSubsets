      note: "For one point of I₀."
    - source: "Shao, Corollary 2.5 (arithmetic removal in a set of small doubling)"
      lean: "LargeSumsetsFromSubsets.exists_forall_exists_subset_card_sdiff_le_forall_add_ne'"
      module: "Challenge"
      status: "proved"
      note: >-
        Library form with the threshold removalConst:
        ArithmeticRemoval.exists_subset_card_sdiff_le_forall_add_ne.
    - source: "Shao, Theorem 1.1 (variant)"
      lean: "LargeSumsetsFromSubsets.exists_forall_exists_subset_card_sdiff_le_card_add_le'"
      module: "Challenge"
      status: "proved"
      note: >-
        Assumes that the full sumset is small. Library form:
        Cleanup.exists_subset_card_sdiff_le_card_add_le.

