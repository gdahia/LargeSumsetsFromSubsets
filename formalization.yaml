# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Large sumsets from medium-sized subsets"
  description: >-
    Lean 4 formalization of the main results of Bollobás, Leader and Tiba, Large sumsets from
    medium-sized subsets. Theorem 1: for A, B ⊆ Z_p with α|B| ≤ |A| ≤ α⁻¹|B| and
    |A| + |B| ≤ (1 - β)p, and c₁c₂ ≥ c(α, β) max(|A|, |B|), there are A' ⊆ A and B' ⊆ B with c₁
    and c₂ elements and |A' + B'| ≥ |A| + |B| - 1. Theorem 2: in an abelian group, for finite A
    and B and integers c₁ ≤ |A| and c₂ ≤ |B| with c₁c₂ > c(σ, ε) max(|A|, |B|), there are subsets
    A₀ and B₀ containing all but an ε proportion of A and B such that c₁ random points of A₀ and
    c₂ random points of B₀ have a sumset of expected size greater than min((1 - ε)|A₀ + B₀|,
    σ|A₀|, σ|B₀|). The results that the paper quotes from the authors' Large sumsets from small
    subsets come from the formalization LargeSumsetsFromSmallSubsets.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11B13", "11B30", "11P70", "05D40"]

sources:
  - title: "Large sumsets from medium-sized subsets"
    authors:
      - "Béla Bollobás"
      - "Imre Leader"
      - "Marius Tiba"
    id: "https://arxiv.org/abs/2206.09366v1"
    type: "paper"
    location: "https://arxiv.org/abs/2206.09366v1"
    relationship: "formalizes"
    note: >-
      Theorems 1 and 2. Theorem 2 is proved without Theorem 3 of the paper (Shao). The proof of
      Theorem 1 uses a weaker form of Theorem 5 of the paper, with the subsets of B depending on
      the set A, and its sample of Y is adapted to that form as explained in simplified_proof.tex.
      See fidelity.divergences.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Large sumsets from small subsets"
    authors:
      - "Béla Bollobás"
      - "Imre Leader"
      - "Marius Tiba"
    id: "https://arxiv.org/abs/2204.07559v2"
    type: "paper"
    location: "https://arxiv.org/abs/2204.07559v2"
    relationship: "background"
    note: >-
      The formalized paper quotes Corollary 24 and Theorem 31 of this paper as its Theorems 4 and
      5. Both are used in the proof of Theorem 1 through the formalization
      LargeSumsetsFromSmallSubsets, Theorem 31 in the form where the subsets of B depend on the
      set A.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On an almost all version of the Balog–Szemerédi–Gowers theorem"
    authors:
      - "Xuancheng Shao"
    id: "https://arxiv.org/abs/1811.10707"
    type: "paper"
    location: "https://arxiv.org/abs/1811.10707"
    relationship: "adapts"
    note: >-
      Discrete Analysis 2019:18. The formalized paper proves Theorem 2 with Theorem 1.1 of this
      paper. The proof here instead minimizes min(|X + Y|, D|X|, D|Y|) + Λ(|A \ X| + |B \ Y|) over
      pairs of subsets and removes the sums of a minimizer that are not popular with a variant of
      Theorem 1.1 that assumes that the full sumset is small, proved from Corollary 2.5 of this
      paper as in the remark that follows it.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A combinatorial proof of the removal lemma for groups"
    authors:
      - "Daniel Král"
      - "Oriol Serra"
      - "Lluís Vena"
    id: "https://doi.org/10.1016/j.jcta.2008.12.003"
    type: "paper"
    relationship: "adapts"
    note: >-
      J. Combin. Theory Ser. A 116 (2009), 971–978. The proof of Theorem 2 uses the tripartite
      graph of this paper, with vertex classes X ∪ (X + X) in place of the group, to deduce
      Corollary 2.5 of Shao from the triangle removal lemma of Mathlib.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The statements use finite sets of an abelian group and of ZMod p, pointwise sums and
      Finset.expect. The proofs use the triangle removal lemma, the Plünnecke–Ruzsa inequality,
      the Cauchy–Davenport theorem in ZMod p and in ℤ, and Finset.addConvolution. Mathlib has
      none of the results of the paper.
  - id: "https://github.com/gdahia/LargeSumsetsFromSmallSubsets"
    relationship: "builds-on"
    note: >-
      A Lake dependency. Its Corollary 24 and its form of Theorem 31, with the subsets of B
      depending on A, are used in the proof of Theorem 1.

status:
  scope: >-
    Theorems 1 and 2 of the paper. The sorry counts refer to the library and Solution.lean;
    Challenge.lean has one placeholder for each of its two statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["gpt-5.6 sol high", "claude opus 5"]
      framework: "Codex"
      tool_setup: >-
        Codex agents guided by an AGENTS.md, with Lean proofs checked in a pinned Lake
        environment.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        The first proofs of Theorem 2, the arithmetic removal lemma and the cleanup theorem,
        written in another repository of the author.
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Lean 4, Mathlib, shell, and the arXiv sources of the paper and of arXiv:2204.07559v2.
        The coordinating agent fixed the statements and an informal proof with explicit
        constants and delegated the proofs and restyling of individual modules to subagents.
      cost:
        wall_time: "two sessions"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        A first instruction to assemble the repository with Theorem 2 and the Palomar layout.
        A second instruction to make the repository a formalization of the paper with the
        removal proof of Theorem 2, to formalize its other main results, to remove Theorem 1.1
        of Fox, Luo, Pham and Zhou, and to follow the author's Palomar conventions. Later, one
        instruction to replace the hypotheses for Theorems 4 and 5 by the results of
        LargeSumsetsFromSmallSubsets, adapting the proof of Theorem 8 to the weaker form of
        Theorem 5 proved there, and to write a note on the adapted proof. Later, one instruction
        to check the style against the author's conventions and adjust it. Later, one instruction
        to restyle every module, including the main statements. Later, one instruction to make
        the repository adhere to the author's Palomar submission and Lean project standards.
  spend_usd: "not tracked"
  notes: >-
    The first proofs of Theorem 2, the arithmetic removal lemma and the cleanup theorem were
    written by Codex agents directed by Gabriel Dahia. Claude Code, directed by Gabriel Dahia,
    restyled them, wrote the statements and proofs of Theorems 1, 6 and 8 and of the lemmas of
    Section 4 of the paper, and wrote Challenge.lean, Solution.lean, the README and this file.
    Later, the agent removed the hypotheses CauchyDavenportStability and
    FewTranslatesNearIntervals, deduced Theorems 4 and 5 from LargeSumsetsFromSmallSubsets,
    adapted the sample of Y in the proof of Theorem 8, and wrote simplified_proof.tex. Later,
    the agent restyled the changed modules and rewrote the docstrings without LaTeX. Later, the
    agent restyled every module and dropped the redundant casts from the main statements.
    Later, the agent restricted Challenge.lean, the README and this file to Theorems 1 and 2,
    moved them to AddCommGroup.lean and ZMod.lean, split the proof of Theorem 1 into stage
    modules, renamed the constants and several definitions, and restyled every module with
    subagents working in parallel. Every proof is checked by Lean.

fidelity:
  divergences: >-
    Theorem 1. The subsets A' and B' have exactly c₁ and c₂ elements.

    Theorem 2. The paper takes any real K; the Lean statement requires σ > 0 in its place. The
    hypothesis is c₁c₂ > c max(|A|, |B|) and the three conclusions are strict inequalities,
    where the paper has ≥ throughout. The sets A₀ and B₀ are nonempty. The random points are
    the values of uniformly random functions Fin c₁ → A₀ and Fin c₂ → B₀. The constant is
    existentially quantified in Challenge.lean and is MediumSizedSubsets.c σ ε in the library,
    of tower type.

review:
  status: "unchecked"
  reviewers: []
  notes: "Unreviewed"

alignment:
  namespace: "LargeSumsetsFromSubsets"
  statements:
    - source: "Theorem 1"
      lean: "LargeSumsetsFromSubsets.exists_subset_card_eq_card_add_card_sub_one_le_card_add'"
      module: "LargeSumsetsFromSubsetsPalomar.Challenge"
      status: "proved"
      note: >-
        Library form: exists_subset_card_eq_card_add_card_sub_one_le_card_add in
        LargeSumsetsFromSubsets.ZMod.
    - source: "Theorem 2"
      lean: "LargeSumsetsFromSubsets.exists_forall_exists_subset_min_lt_expect_card_add'"
      module: "LargeSumsetsFromSubsetsPalomar.Challenge"
      status: "proved"
      note: >-
        Library form with the explicit constant MediumSizedSubsets.c σ ε:
        exists_subset_min_lt_expect_card_add in LargeSumsetsFromSubsets.AddCommGroup.

acknowledgements: "Lean 4 and Mathlib; the Palomar registry template."
