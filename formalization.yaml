  spend_usd: "not tracked"
  notes: >-
    The Lean proofs were written by AI agents: the proofs of the Bollobás–Leader–Tiba theorem,
    the arithmetic removal lemma and the cleanup theorem by Codex agents in
    DenseSetsWithoutLargeSumsets, and the proof of the Fox–Luo–Pham–Zhou theorem by Claude
    Code in CountingSetsWithGivenDoublingViaDimension. This repository was assembled by
    Claude Code under the direction of Gabriel Dahia, and restyled by OpenCode. Later, the
    agent moved Challenge.lean and Solution.lean to LargeSumsetsFromSubsetsPalomar/, named
    the statements of Challenge.lean after the library theorems with a prime, reduced the
    imports of Challenge.lean to the Mathlib module its statements need, left Challenge out
    of the default build targets, wrote the numerals in the definitions of Challenge.lean
    and of the library as natural numbers, so that the definitions contain no proofs and the
    comparator compares them in full, stated the arithmetic removal lemma and the cleanup
    theorem of the library in the form of Challenge.lean, removed from these statements the
    casts that Lean inserts, and rewrote the README and this file. Every proof is checked by
    Lean.

fidelity:
  divergences: >-
    Bollobás–Leader–Tiba, Theorem 2. The paper asserts that a constant c exists for all K
    and ε > 0. The Lean statement takes σ > 0 and ε > 0 and gives the explicit constant
    originalBltConstant σ ε. It assumes c₁c₂ > c max(|A|, |B|) where the paper assumes
    c₁c₂ ≥ c max(|A|, |B|). Its conclusion is strict throughout: |A₀| > (1 - ε)|A|,
    |B₀| > (1 - ε)|B| and E|A' + B'| > min((1 - ε)|A₀ + B₀|, σ|A₀|, σ|B₀|), where the paper
    has non-strict inequalities, and A₀ and B₀ are nonempty. The c₁ points of A₀ and the c₂
    points of B₀ are chosen independently and uniformly, with repetitions allowed, as a
    uniformly random pair of functions Fin c₁ → A₀ and Fin c₂ → B₀, and A' and B' are the
    sets of their values.

    Cleanup theorem. Shao's Theorem 1.1 takes |A| = |B| = N, a set Γ of at least
    (1 - δ) N^2 pairs and the hypothesis |A +_Γ B| ≤ KN, and gives |A' + B'| ≤ |A +_Γ B| + εN.
    The Lean theorem takes sets X and Y of any sizes and a set P, with Γ the set of pairs
    whose sum lies in P. It assumes |X + Y| ≤ D min(|X|, |Y|), which is stronger than
    Shao's hypothesis, removes at most ρ min(|X|, |Y|) elements from each set, and gives
    |X₀ + Y₀| ≤ |P| + ρ min(|X|, |Y|). The threshold for δ is removalConst(16 D^7, ρ/D).

    Arithmetic removal lemma. Shao's Corollary 2.5 takes K ≥ 1 and δ sufficiently small in
    terms of K and ε. The Lean statement takes K ≥ 0 and 0 ≤ δ ≤ removalConst K ε, a fixed
    multiple of Mathlib's triangle removal bound, whose positivity is stated separately.

    Fox–Luo–Pham–Zhou, Theorem 1.1. The paper asserts that a constant c > 0 exists. The
    Lean statement has c = 1/14, and s is a natural number.

review:
  status: "unchecked"
  reviewers: []
  notes: "Unreviewed"

alignment:
  namespace: "LargeSumsetsFromSubsets"
  statements:
    - source: "Bollobás–Leader–Tiba, Theorem 2"
      lean: "LargeSumsetsFromSubsets.exists_subset_min_lt_expect_card_add'"
      module: "LargeSumsetsFromSubsetsPalomar.Challenge"
      status: "proved"
      note: "With strict inequalities and the explicit constant originalBltConstant."
    - source: "Bollobás–Leader–Tiba, Theorem 2, unspecified constant"
      lean: "LargeSumsetsFromSubsets.exists_forall_exists_subset_min_lt_expect_card_add"
      module: "LargeSumsetsFromSubsets.MediumSizedSubsets"
      status: "proved"
      note: "With strict inequalities and a constant c that exists."
    - source: "Bollobás–Leader–Tiba, Theorem 2, normalized form"
      lean: "LargeSumsetsFromSubsets.exists_subset_min_le_expectSumset"
      module: "LargeSumsetsFromSubsets.MediumSizedSubsets"
      status: "proved"
      note: "For K ≥ 1 and 0 < ε ≤ 1, with the constant bltSampleConst K ε."
    - source: "Bollobás–Leader–Tiba, Theorem 2, square-root form"
      lean: "LargeSumsetsFromSubsets.exists_subset_card_le_mul_sqrt_min_le_card_add"
      module: "LargeSumsetsFromSubsets.MediumSizedSubsets"
      status: "proved"
      note: "Not stated in the paper."
    - source: "Shao, Corollary 2.5 (arithmetic removal in a set of small doubling)"
      lean: "LargeSumsetsFromSubsets.ArithmeticRemoval.exists_subset_card_sdiff_le_forall_add_ne'"
      module: "LargeSumsetsFromSubsetsPalomar.Challenge"
      status: "proved"
      note: "With the threshold removalConst K ε."
    - source: "Shao, Corollary 2.5, positivity of the threshold"
      lean: "LargeSumsetsFromSubsets.ArithmeticRemoval.removalConst_pos'"
      module: "LargeSumsetsFromSubsetsPalomar.Challenge"
      status: "proved"
      note: "removalConst K ε > 0 for K ≥ 0 and ε > 0."
    - source: "Shao, Theorem 1.1"
      lean: "LargeSumsetsFromSubsets.Cleanup.exists_subset_card_sdiff_le_card_add_le'"
      module: "LargeSumsetsFromSubsetsPalomar.Challenge"
      status: "proved"
      note: "A variant that assumes the full sumset is small."
    - source: "Fox–Luo–Pham–Zhou, Theorem 1.1"
      lean: "LargeSumsetsFromSubsets.FewTranslates.exists_subset_card_le_mul_le_card_add'"
      module: "LargeSumsetsFromSubsetsPalomar.Challenge"
      status: "proved"
      note: "With c = 1/14."

