name = "LargeSumsetsFromSubsets"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LargeSumsetsFromSubsets", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The full proof development; `Solution.lean` imports it.
[[lean_lib]]
name = "LargeSumsetsFromSubsets"

# The statement-only surface a reader audits. Not a default target, so that `lake build` does not
# build its `sorry`s; the comparator job builds it by name.
[[lean_lib]]
name = "Challenge"
roots = ["LargeSumsetsFromSubsetsPalomar.Challenge"]

# Proves the declarations stated in `Challenge.lean`; Comparator checks the two agree.
[[lean_lib]]
name = "Solution"
roots = ["LargeSumsetsFromSubsetsPalomar.Solution"]
